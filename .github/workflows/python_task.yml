name: Python Task

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        default: '["3.10"]'
        type: string
      command:
        required: true
        type: string

jobs:
  python-job:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ${{fromJson(inputs.python-version)}}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "${{ matrix.python-version }}"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build Prophecies
        run: uv build

      - name: Run specified command
        run: ${{ inputs.command }}
